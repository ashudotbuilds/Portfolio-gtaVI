<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16171d" />
    <meta
      name="description"
      content="Portfolio of Jarvis, a full-stack developer in Miami."
    />
    <title>Grand Theft Developer · Jarvis, Full-Stack Developer</title>
    <style>
      html { background: #16171d; }
      body { margin: 0; }
      #site-loader {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 25%, #292437, #16171d 75%);
      }
      #site-loader[hidden] { display: none; }
      #site-loader img {
        width: clamp(4.5rem, 8vw, 8rem);
        filter: brightness(0) invert(1);
        animation: loader-pulse 1.5s ease-in-out infinite alternate;
      }
      @keyframes loader-pulse {
        from { opacity: 0.22; }
        to { opacity: 0.6; }
      }
      @media (prefers-reduced-motion: reduce) {
        #site-loader img { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="site-loader" role="status" aria-label="Loading portfolio">
      <img src="/src/assets/brand/loader-logo.svg" alt="" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
